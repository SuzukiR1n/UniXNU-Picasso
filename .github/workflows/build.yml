name: Picasso build and validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_os:
        description: Audit the pinned iPhone X iOS 16 kernel on macOS
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: picasso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNIXNU_SOURCE: ${{ github.workspace }}/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned upstream revision
        run: echo "REV=$(cat upstream.rev)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.REV }}
          path: upstream
          persist-credentials: false
      - name: Install device tree compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Validate profiles, device tree and image gate
        run: |
          python scripts/check-device.py --upstream upstream --dtc
          python upstream/scripts/porting-record.py check --device .
          c++ -std=c++11 -Wall -Wextra -Werror -Idrivers/ArmCpu tests/timer_ppi.cpp -o /tmp/timer-ppi
          /tmp/timer-ppi
          python scripts/unixnu.py defconfig picasso_defconfig
          python scripts/unixnu.py status --json > out/status.json
      - uses: actions/upload-artifact@v4
        with:
          name: picasso-source-validation
          path: |
            out/status.json
            board.toml
            hardware.toml
            sources.lock.toml
          if-no-files-found: error

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm make gcc g++ uuid-dev nasm
      - name: Build the shared UniXNU UEFI application
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/unixnu.py defconfig picasso_defconfig
          python scripts/unixnu.py build package -j 4
      - name: Record artifact meaning
        if: always()
        run: |
          mkdir -p out
          echo 'UniXNU.efi is a UEFI application. This job does not build a Picasso firmware FD or a boot.img.' > out/ARTIFACT-NOTE.txt
          cat out/ARTIFACT-NOTE.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picasso-unixnu-efi
          path: |
            out/**/package/Build/Out/**
            out/**/logs/**
            out/ARTIFACT-NOTE.txt
          retention-days: 14

  ios16-input-audit:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.audit_os
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Apple identity, kernel digest and Darwin major
        run: |
          python scripts/unixnu.py --prepare
          mkdir -p out/ios16-audit
          set -o pipefail
          python scripts/audit-ios16.py --upstream .cache/UniXNU --decode 2>&1 | tee out/ios16-audit/audit.log
      - name: Record the remaining ABI work
        if: always()
        run: |
          echo 'Target: iPhone X iOS 16.7.16 (20H392). This job audits Apple inputs; the Darwin 22 source/driver/prelink ABI port remains pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picasso-iphone-x-ios16-input-audit
          path: |
            out/ios16-audit/*.json
            out/ios16-audit/*.log
          retention-days: 14
