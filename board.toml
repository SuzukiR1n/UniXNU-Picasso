schema_version = 2

[board]
name = "picasso"
soc = "SM7250"
soc_source = "sm7250"
os_profile = "ios-16.7.16-20H392"
description = "Redmi K30 5G targeting iPhone X iOS 16; Darwin 22 ABI and firmware pending"
kit = "picasso"

[components]
include = ["XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "picasso_defconfig"
config_fragments = ["soc:configs/sm7250.config"]
patch_series = ["soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = []

[device_tree]
source = "device:dts/picasso.dts"
include_dirs = ["soc:dts"]

# A firmware DSC/FD and a payload memory window are deliberately not invented.
# scripts/unixnu.py refuses image creation until these have been qualified.
